{% if is_paginated %}
  <nav aria-label="Pagination Navigation" style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; font-size: 0.85rem;">
    <div style="color: var(--text-muted);">
      Showing page {{ page_obj.number }} of {{ paginator.num_pages }} ({{ paginator.count }} total records)
    </div>
    <div style="display: flex; gap: 0.4rem;">
      {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}{% if current_q %}&q={{ current_q }}{% endif %}{% if current_status %}&status={{ current_status }}{% endif %}{% if current_category %}&category={{ current_category }}{% endif %}{% if current_date_from %}&date_from={{ current_date_from }}{% endif %}{% if current_date_to %}&date_to={{ current_date_to }}{% endif %}" class="btn btn-secondary btn-sm">
          &laquo; Previous
        </a>
      {% endif %}

      <span style="display: inline-flex; align-items: center; padding: 0 0.5rem; font-weight: 600; color: var(--text-main);">
        {{ page_obj.number }}
      </span>

      {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}{% if current_q %}&q={{ current_q }}{% endif %}{% if current_status %}&status={{ current_status }}{% endif %}{% if current_category %}&category={{ current_category }}{% endif %}{% if current_date_from %}&date_from={{ current_date_from }}{% endif %}{% if current_date_to %}&date_to={{ current_date_to }}{% endif %}" class="btn btn-secondary btn-sm">
          Next &raquo;
        </a>
      {% endif %}
    </div>
  </nav>
{% endif %}
